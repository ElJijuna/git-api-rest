services:
  git-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: git-api-rest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - REPOS_CONFIG_PATH=/config/repos.yml
      - CLONE_BASE_PATH=/data/repos
      - GIT_PULL_INTERVAL=${GIT_PULL_INTERVAL:-60}
      - BITBUCKET_SERVER_HOST=${BITBUCKET_SERVER_HOST:-}
      - BITBUCKET_USER=${BITBUCKET_USER:-}
      - BITBUCKET_TOKEN=${BITBUCKET_TOKEN:-}
      - GIT_CLONE_PROTOCOL=${GIT_CLONE_PROTOCOL:-ssh}
      - BITBUCKET_SSH_PORT=${BITBUCKET_SSH_PORT:-7999}
      - PORT=3000
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${REPOS_CONFIG_FILE:-./repos.yml}:/config/repos.yml:ro
      - git-repos:/data/repos
      - ${SSH_KEY_PATH:-~/.ssh}:/root/.ssh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  git-repos:
    driver: local
